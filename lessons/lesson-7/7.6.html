<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 100px;
        }
        .card{
            width:200px;
            height: 250px;
            background-color: #a4a4a4;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .sale{
            width:60px;
            height: 40px;
            background-color: #a4a4a4;
            position: absolute;
            top:-20px;
            border-radius: 20px 20px 0 0;
        }
        .sale-bottom{
            width:60px;
            height: 40px;
            background-color: #a4a4a4;
            position: absolute;
            bottom: -20px;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="sale">
        </div>
        <p>Lorem ipsum.</p>
        <p>Id, sapiente.</p>
        <p>Accusantium, numquam?</p>
        <div class="sale-bottom">   </div>
     </div>
</body>
</html>
