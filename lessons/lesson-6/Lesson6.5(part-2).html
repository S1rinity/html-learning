<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register</title>
    <style>
        label{
            display: block;
            margin-top: 10px;
        }
        form sup{
            color: red;
        }
        textarea{
            resize:none;
            width: 100px;
        }
        .form-register{
            border: 8px solid lightblue;
            width: 30%;
            border-radius: 20px;
            padding: 10px;
        }
        input[type="text"]{
            background: #8c0202;
            border: 5px solid blueviolet;
            border-radius: 10px;
            color: green;
        }
        input[type="text"]::placeholder{
            color:white;
        }
        input[type="text"]:focus{
            outline:2px solid lawngreen;
        }
    </style>
</head>
<body>
<form class="form-register">
    <label for="username"> Register enter name </label>
    <input type="text" name="username" placeholder="Username" id="username" required><sup>*</sup>
    
    <label for="email">Enter your email</label>
    <input type="email" name="emailadress" placeholder="example@gmail.com" id="email" required><sup>*</sup>
    
    <label for="password">Password </label>
    <input type="password" name="password" placeholder="qwerty" id="password" required><sup>*</sup>
    
    <label for="age"> Register enter name </label>
    <input type="number" name="age" id="age" min="18" max="100">

    <label> Gender </label>
    <label> <input type="radio" name="gender" value="gender-male">Male</label>
    <label> <input type="radio" name="gender" value="gender-female">Woman</label>

    <label>
        <input type="checkbox" name="ad">Ad
    </label>

    <label for="country">Country</label>
    <select id="country">
        <option value="">Choose your country</option>
        <option value="ukraine">Ukraine</option>
        <option value="kanada">Kanade</option>
        <option value="greenland">Greenland</option>
    </select>

    <label for="phone"></label>
    <select id="phone">
        <option value="">Phone</option>
        <optgroup label="Apple">
            <option value="6s">Iphone 6s</option>
            <option value="7">Iphone 7</option>
            <option value="XR">Iphone XR</option>
        </optgroup>
        <optgroup label="Samsung">
            <option value="s25">s25</option>
            <option value="ultra">s25 ultra</option>
        </optgroup>
    </select>

    <label for="commnet"></label>
    <textarea id="commnet" rows="5" cols="50"></textarea>
    
    <div>
        <input type="submit" value="Push">
        <input type="reset" value="reset">
    </div>
</form>
</body>
</html>
